<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15202e"/>
      <stop offset="1" stop-color="#1f2f45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7eb6ff"/>
    </marker>
    <!-- One Raspberry Pi 5-ish board, origin at its top-left, 300x190 -->
    <g id="board">
      <rect x="0" y="0" width="300" height="190" rx="12" fill="#2f7d4f" stroke="#57b07a" stroke-width="2"/>
      <!-- mounting holes -->
      <circle cx="16" cy="16" r="6" fill="#15202e" stroke="#c9a94a" stroke-width="2"/>
      <circle cx="284" cy="16" r="6" fill="#15202e" stroke="#c9a94a" stroke-width="2"/>
      <circle cx="16" cy="174" r="6" fill="#15202e" stroke="#c9a94a" stroke-width="2"/>
      <circle cx="284" cy="174" r="6" fill="#15202e" stroke="#c9a94a" stroke-width="2"/>
      <!-- GPIO header -->
      <rect x="40" y="8" width="200" height="16" rx="2" fill="#1a1a1a"/>
      <g fill="#c9a94a">
        <rect x="46" y="12" width="4" height="8"/><rect x="58" y="12" width="4" height="8"/><rect x="70" y="12" width="4" height="8"/><rect x="82" y="12" width="4" height="8"/><rect x="94" y="12" width="4" height="8"/><rect x="106" y="12" width="4" height="8"/><rect x="118" y="12" width="4" height="8"/><rect x="130" y="12" width="4" height="8"/><rect x="142" y="12" width="4" height="8"/><rect x="154" y="12" width="4" height="8"/><rect x="166" y="12" width="4" height="8"/><rect x="178" y="12" width="4" height="8"/><rect x="190" y="12" width="4" height="8"/><rect x="202" y="12" width="4" height="8"/><rect x="214" y="12" width="4" height="8"/><rect x="226" y="12" width="4" height="8"/>
      </g>
      <!-- SoC -->
      <rect x="70" y="60" width="70" height="70" rx="4" fill="#9aa3ad" stroke="#cfd6dd" stroke-width="2"/>
      <!-- RP1 -->
      <rect x="165" y="95" width="40" height="40" rx="3" fill="#2a2a2a" stroke="#555" stroke-width="1.5"/>
      <!-- USB stacks (right edge) -->
      <rect x="252" y="40" width="54" height="40" rx="3" fill="#b8c0c8" stroke="#e1e6ea" stroke-width="1.5"/>
      <rect x="252" y="88" width="54" height="40" rx="3" fill="#b8c0c8" stroke="#e1e6ea" stroke-width="1.5"/>
      <rect x="262" y="52" width="38" height="6" fill="#3b6fd1"/><rect x="262" y="64" width="38" height="6" fill="#3b6fd1"/>
      <rect x="262" y="100" width="38" height="6" fill="#222"/><rect x="262" y="112" width="38" height="6" fill="#222"/>
      <!-- RJ45 (right edge, bottom) -->
      <rect x="248" y="136" width="58" height="46" rx="3" fill="#b8c0c8" stroke="#e1e6ea" stroke-width="1.5"/>
      <rect x="262" y="148" width="32" height="24" rx="2" fill="#2a2a2a"/>
      <!-- Active Cooler outline over the SoC -->
      <circle cx="105" cy="95" r="44" fill="none" stroke="#e1e6ea" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 4"/>
    </g>
    <!-- Fan blades -->
    <g id="fan">
      <circle r="10" fill="#e1e6ea"/>
      <path d="M0-10 C 18-30, 34-14, 30 0 Z" fill="#e1e6ea" fill-opacity="0.85"/>
      <path d="M0-10 C 18-30, 34-14, 30 0 Z" fill="#e1e6ea" fill-opacity="0.85" transform="rotate(120)"/>
      <path d="M0-10 C 18-30, 34-14, 30 0 Z" fill="#e1e6ea" fill-opacity="0.85" transform="rotate(240)"/>
    </g>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <!-- BEFORE -->
  <g transform="translate(90 120)">
    <use href="#board"/>
    <!-- idle fan: dimmed and crossed -->
    <g transform="translate(105 95)" opacity="0.35"><use href="#fan"/></g>
    <path d="M80 70 L130 120 M130 70 L80 120" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round"/>
    <!-- USB dongle dangling from the top USB port -->
    <path d="M306 60 C 340 60, 345 120, 330 170" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
    <rect x="304" y="168" width="52" height="74" rx="8" fill="#3a3f47" stroke="#6b7480" stroke-width="2"/>
    <rect x="318" y="226" width="24" height="14" rx="2" fill="#1a1a1a"/>
    <path d="M330 242 C 330 270, 300 280, 270 300" fill="none" stroke="#3b6fd1" stroke-width="6" stroke-linecap="round"/>
    <!-- built-in NIC unused -->
    <path d="M262 148 L294 172 M294 148 L262 172" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
    <!-- thermometer -->
    <g transform="translate(-40 40)">
      <rect x="-6" y="0" width="12" height="80" rx="6" fill="#2a2a2a" stroke="#e1e6ea" stroke-width="2"/>
      <rect x="-3" y="10" width="6" height="70" fill="#ff6b6b"/>
      <circle cx="0" cy="90" r="12" fill="#ff6b6b" stroke="#e1e6ea" stroke-width="2"/>
    </g>
    <text x="150" y="-36" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e1e6ea" opacity="0.75">Talos</text>
    <text x="150" y="-10" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#9fb0c4">mainline kernel · USB dongle · no fan</text>
  </g>

  <!-- arrow -->
  <path d="M520 215 L 660 215" stroke="#7eb6ff" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- AFTER -->
  <g transform="translate(780 120)">
    <use href="#board"/>
    <g transform="translate(105 95)"><use href="#fan"/></g>
    <!-- cable straight from the built-in RJ45 -->
    <path d="M306 160 C 340 160, 350 220, 340 300" fill="none" stroke="#3b6fd1" stroke-width="6" stroke-linecap="round"/>
    <!-- link light -->
    <circle cx="300" cy="142" r="4" fill="#8cff9e"/>
    <!-- thermometer -->
    <g transform="translate(-40 40)">
      <rect x="-6" y="0" width="12" height="80" rx="6" fill="#2a2a2a" stroke="#e1e6ea" stroke-width="2"/>
      <rect x="-3" y="50" width="6" height="30" fill="#7eb6ff"/>
      <circle cx="0" cy="90" r="12" fill="#7eb6ff" stroke="#e1e6ea" stroke-width="2"/>
    </g>
    <!-- snowflake -->
    <g transform="translate(26 -46) scale(0.8)" stroke="#7eb6ff" stroke-width="4" stroke-linecap="round" fill="none">
      <g id="arm"><path d="M0 0 V-26 M0-16 L-7-23 M0-16 L7-23"/></g>
      <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
    </g>
    <text x="150" y="-36" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e1e6ea">NixOS + k3s</text>
    <text x="150" y="-10" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#9fb0c4">vendor kernel · built-in end0 · fan on</text>
  </g>
</svg>
